name: reliability-and-security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.lock
      - run: python -m pytest -q --junitxml=evidence/ci-tests.xml
      - run: node --check harness/static/app.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: evidence/ci-tests.xml
