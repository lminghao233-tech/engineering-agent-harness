services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    env_file: ../.env
    environment:
      HARNESS_DATA: /data
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ../var:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
# Trusted worker runs as a host systemd service. Docker socket is deliberately absent from the API.
