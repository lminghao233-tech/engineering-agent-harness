<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harness · 研发执行控制台</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><aside><a class="brand" href="#tasks"><span class="brand-icon">H</span><span>Harness<small>ENGINEERING WORKSPACE</small></span></a><div class="workspace">研发平台 <span>单团队</span></div><nav><a href="#tasks" data-nav="tasks"><b>▤</b>任务工作台</a><a href="#evidence" data-nav="evidence"><b>⌘</b>补丁与验证</a><a href="#experiments" data-nav="experiments"><b>◫</b>评测中心</a><a href="#settings" data-nav="settings"><b>⚙</b>环境与接入</a></nav><div class="sidebar-foot"><span class="dot"></span> 执行证据可追溯<small>v0.1.0 · Engineering Agent Harness</small></div></aside>
<div class="shell"><header><div id="breadcrumb">研发平台 / 任务工作台</div><div class="header-right"><span id="connection">正在连接</span><button class="subtle" id="connect">连接工作区</button><span class="avatar">研</span></div></header><main id="app" aria-live="polite"></main><footer>模型行动经过执行策略校验 · 最终补丁需人工审核 <span>LOCAL REVIEW · NO AUTOMATIC MERGE</span></footer></div>
<dialog id="connection-dialog"><form id="connection-form"><div class="eyebrow">WORKSPACE ACCESS</div><h2>连接你的工作区</h2><p>输入服务端配置的访问令牌。令牌仅保存在此标签页的会话中。</p><label>API 访问令牌<input id="token" type="password" autocomplete="off" required minlength="32"></label><div class="actions"><button type="button" id="close-connect" class="subtle">取消</button><button class="primary">连接</button></div></form></dialog>
<dialog id="create-dialog"><form id="task-form"><div class="eyebrow">NEW EXECUTION</div><h2>创建研发任务</h2><label>导入公开基准任务<select id="catalog-choice"><option value="">手动填写真实 issue</option></select></label><div class="form-grid"><label>实例 / Issue 标识<input name="instance_id" required placeholder="owner__repo-123"></label><label>GitHub 仓库<input name="repo" required placeholder="owner/repo"></label></div><label>Base commit · 完整 40 位 SHA<input name="base_commit" required pattern="[a-f0-9]{40}"></label><label>Issue 描述<textarea name="problem_statement" required minlength="10" rows="5"></textarea></label><label>可信测试路径（逗号分隔）<input name="tests" value="tests" required></label><div class="form-grid"><label>模型调用上限<input name="max_calls" type="number" value="12" min="1" max="100"></label><label>预留 Token 总预算<input name="max_tokens" type="number" value="240000" min="4096" max="2000000"></label><label>总时长 / 秒<input name="max_seconds" type="number" value="1800" min="10" max="7200"></label><label>工具时长 / 秒<input name="max_tool_seconds" type="number" value="600" min="1" max="3600"></label></div><p class="muted">预算跨重试与恢复累计。模型或容器未就绪时，任务将保留阻塞原因。</p><div class="actions"><button type="button" id="close-create" class="subtle">取消</button><button class="primary">提交任务 →</button></div><p class="error" id="form-error"></p></form></dialog><div id="toast" role="status"></div></body></html>
